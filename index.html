    case 'finish-writing':{const text=$('#writing-answer')?.value.trim()||'';const checks=[...document.querySelectorAll('.selfcheck')],min=[14,28,45][state.level-1];if(text.length<min){alert(`Try to write a little more English (${min} characters or more).`);return;}if(checks.filter(x=>x.checked).length<2){alert('Read through your text and tick at least two checklist points first.');return;}state.answer=text;afterGameOpen();return;}
    case 'namefive-timer':tickNameFive();return;
    case 'namefive-add':{const input=$('#namefive-input'),w=input?.value.trim();if(!w)return;const normalized=normalize(w);if(state.name5.some(x=>normalize(x)===normalized)){const msg=$('#namefive-status');if(msg)msg.textContent='You already used that word. Try another one.';return;}if(state.name5.length>=10)return;state.name5.push(w);redraw();$('#namefive-input')?.focus();return;}
    case 'namefive-finish':{if(state.name5.length<5){const msg=$('#namefive-status');if(msg)msg.textContent='Try to find at least five different English words before finishing.';return;}if(state.level>=2){const txt=normalize($('#namefive-sentence')?.value),found=state.name5.filter(w=>txt.includes(normalize(w))).length,need=state.level===3?2:1;if(!txt||found<need){const msg=$('#namefive-status');if(msg)msg.textContent='Write a sentence using at least '+need+' of your listed words.';return;}}afterGameOpen();return;}
    case 'spelling-hint':showInlineHint(spellingItem().rule);return;
    case 'check-spelling':{const ans=$('#spelling-answer')?.value||'';if(!ans.trim())return;const s=spellingItem();evaluate(normalize(ans)===normalize(s.correct),`Correct form: ${s.hint}. Rule: ${s.rule}`);return;}
    case 'accent-select':{state.acc=Number(btn.dataset.index);if(!state.matches.includes(state.acc))state.matches.push(state.acc);redraw();return;}
    case 'accent-listen':{const acc=ACCENTS[state.acc||0],phrase=acc.words.map(w=>w[0]).join('. ')+'.',lang=acc.id;if(acc.country==='Scotland'){const scottish=window.speechSynthesis?.getVoices().find(v=>/scot/i.test(v.name));if(scottish){const u=new SpeechSynthesisUtterance(phrase);u.voice=scottish;u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u);$('#voice-notice').textContent='Playing '+scottish.name+'.';}else{$('#voice-notice').textContent='No Scottish voice installed. Playing a general British voice instead; this is not a demonstration of a Scottish accent.';say(phrase,'en-GB');}}else{const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase()===lang.toLowerCase());$('#voice-notice').textContent=v?`Playing ${v.name}.`:`No matching ${acc.country} voice found. A different English voice may be used.`;say(phrase,lang);}return;}
    case 'finish-accents':if(state.matches.length>=(state.level===1?2:state.level===2?3:4))afterGameOpen();return;
    case 'hint-more':state.seenClues=Math.min(state.seenClues+1,4);redraw();return;
    case 'check-hint':{const ans=$('#hint-answer')?.value||'';if(!ans.trim())return;const h=state.topic.hint;evaluate(normalize(ans)===normalize(h.answer),`The secret word is “${h.answer}”. ${h.clues[3]}`);return;}
    case 'clear-drawing':{const c=$('#draw-canvas');c?.getContext('2d').clearRect(0,0,c.width,c.height);return;}
    case 'save-drawing':{const c=$('#draw-canvas');if(!c)return;const a=document.createElement('a');a.download='pictionary-english5d.png';a.href=c.toDataURL('image/png');a.click();return;}
    case 'finish-pictionary':afterGameOpen();return;
    case 'spoon-card':{const cards=spoonCards(),card=cards.find(x=>x.id===btn.dataset.id);if(!card||state.selected.includes(card.id)||state.matches.includes(card.pair))return;state.selected.push(card.id);if(state.selected.length===2){const a=cards.find(x=>x.id===state.selected[0]),b=cards.find(x=>x.id===state.selected[1]);if(a.pair===b.pair){state.matches.push(a.pair);state.message='Correct pair! Say both words aloud.';state.selected=[];if(state.matches.length===4){afterGameOpen();return;}}else{state.message='Not a match. Try again.';state.selected=[];}}redraw();return;}
    case 'snakes-roll':{state.pendingRoll=1+Math.floor(Math.random()*6);redraw();return;}
    case 'snakes-answer':{const index=(state.round+state.position)%state.topic.vocab.length,expected=state.topic.vocab[index][0],ok=normalize(btn.dataset.value)===normalize(expected);state.round++;if(ok){state.position=Math.min(20,state.position+state.pendingRoll);const landed=state.position;state.position=JUMPS[state.position]||state.position;state.message=`Correct: ${expected}! ${landed!==state.position?(state.position>landed?'Ladder up!':'Snake down!'):''}`;}else{state.position=Math.max(0,state.position-(state.level-1));state.message=`The right word is ${expected}. Try again on your next turn.`;}state.pendingRoll=0;if(state.position>=20){afterGameOpen();return;}redraw();return;}
    case 'person-add':{const v=$('#person-answer')?.value.trim();if(!v)return;if(state.donePeople.length>=3)return;state.donePeople.push(v);redraw();return;}
    case 'finish-people':if(state.donePeople.length>=3)afterGameOpen();return;
    case 'detective-answer':{const c=CASES[state.level-1],i=Number(btn.dataset.index);evaluate(i===c.answer,`${c.why} This is the evidence that supports the answer.`);return;}
    default:return;
    }
  }
  function stopRecordingIfAny(){try{if(recording?.recorder?.state==='recording')recording.recorder.stop();}catch{}}
  document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-action],button[data-route],button[data-say],a[data-route],button[data-choose]');if(!b)return;if(b.dataset.route){ev.preventDefault();go(b.dataset.route);return;}if(b.dataset.say!==undefined){ev.preventDefault();say(b.dataset.say,b.dataset.lang||'en-GB');return;}if(b.dataset.choose){const s=b.dataset.choose,map={Listening:['everyday','dictation'],Speaking:['everyday','speaking'],Reading:['stories','reading'],Writing:['myworld','writing'],Vocabulary:['myworld','words'],Grammar:['grammar','sentences']},[t,g]=map[s];const node=$('#recommendations');if(node)node.innerHTML=`<strong>Try this:</strong> ${e(s)} · Level 1. <button class="recommended-link" data-route="play/${t}/${g}/1">Start ${e(g.replace(/^./,c=>c.toUpperCase()))} →</button> <button class="recommended-link" data-route="topic/${t}">See topic →</button>`;return;}if(b.dataset.action)handleAction(b.dataset.action,b);});
  document.addEventListener('keydown',ev=>{if(ev.key==='Enter' && ev.target.matches('#word-answer,#dictation-answer,#spelling-answer,#hint-answer,#namefive-input,#person-answer')){ev.preventDefault();const map={'word-answer':'check-word','dictation-answer':'check-dictation','spelling-answer':'check-spelling','hint-answer':'check-hint','namefive-input':'namefive-add','person-answer':'person-add'};const k=map[ev.target.id];if(k)handleAction(k,ev.target);}});
  $('#menu-button').addEventListener('click',()=>{const nav=$('#nav'),open=nav.classList.toggle('open');$('#menu-button').setAttribute('aria-expanded',String(open));});
  window.addEventListener('hashchange',()=>{$('#nav').classList.remove('open');$('#menu-button').setAttribute('aria-expanded','false');router();});
  window.addEventListener('pagehide',stopAudio);
  router();
})();
</script></body></html>
