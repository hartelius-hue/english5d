    .crumb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:#587184;font-size:13px;margin:2px 0 18px}.crumb button{border:0;background:transparent;color:#0a665f;font-weight:800;text-decoration:underline;padding:4px 0}

  const ROOMS=[
    {id:'workshop',order:'01',theme:'Warm workshop',title:"Santa’s Missing Gift List",subtitle:'A mysterious note, a missing list and a locked wooden chest.',tag:'Find the list before Christmas Eve!',icon:'🎁',story:'Santa’s most important list has disappeared. Only five clue cards and an old wooden chest remain. Work with the elves, solve the puzzles and unlock the chest before the sleigh leaves.',ending:'The golden key turns, and the chest opens! Inside is Santa’s missing gift list, tied with a shiny green ribbon. Santa checks every name, and the sleigh is ready to fly.',final:'SANTA',tiles:['N','A','T','S','A'],missions:[
      {name:'The Empty Desk',skill:'Reading comprehension',kind:'choice',intro:'Read the note on Santa’s desk.',passage:'At seven o’clock, Santa put his gift list on the wooden desk. Mia the elf carried three red boxes to the shelf. At eight o’clock, Ben borrowed a pencil from the desk. When Santa came back, the list was gone. Ben saw a little silver bell beside the desk.',q:'What did Ben borrow from the desk?',options:['A silver bell','A green ribbon','A pencil','A red box'],correct:'A pencil',hint:'Find the sentence about Ben at eight o’clock.',reply:'Ben borrowed a pencil. The note also tells us that he saw a silver bell.',letter:'N'},
      {name:'Toy Workshop Words',skill:'Sentence building',kind:'order',intro:'Put the words in the correct order. Start with a capital letter and finish with a full stop.',target:'The elves are searching behind the clock.',tiles:['behind','clock.','are','The','searching','elves','the'],hint:'Begin with “The elves”. What are they doing?',reply:'The subject comes first: “The elves”, followed by “are searching”.',letter:'A'},
      {name:'The Box Label',skill:'Spelling rules',kind:'type',intro:'Read the label and write the missing plural word.',passage:'There are three _______ on the shelf. (box)',q:'Write the correct plural of box:',answer:'boxes',hint:'Words ending in -x usually add -es in the plural.',reply:'Box becomes boxes: add -es after -x.',letter:'T'},
      {name:'The Whispering Clock',skill:'Listening',kind:'listen',intro:'Listen to the elf’s message, then choose the correct answer.',audio:'Look behind the tall red clock for a golden key.',q:'What must you look for?',options:['A silver bell','A golden key','A blue pencil','A green gift'],correct:'A golden key',hint:'Listen for the object after the words “look for”.',reply:'The elf told you to look for a golden key behind the red clock.',letter:'S'},
      {name:'Ribbon Match',skill:'Vocabulary',kind:'match',intro:'Match the three English Christmas words with their Danish meanings.',pairs:[['present','gave'],['ribbon','bånd'],['shelf','hylde']],hint:'A ribbon is the colourful strip you tie around a present.',reply:'Present = gave, ribbon = bånd, and shelf = hylde.',letter:'A'},
      {name:'The Christmas Chest',skill:'Word puzzle',kind:'final',intro:'You have collected five letters. Put them in the correct order to open the chest.',q:'The password is the name of the person with a red coat who delivers presents.',hint:'The word begins with S and has five letters.',reply:'SANTA is the five-letter password.'}
    ]},
    {id:'express',order:'02',theme:'Snowy night journey',title:'The Midnight Reindeer Express',subtitle:'A snowbound railway, a missing map and one last train.',tag:'Catch the train before midnight!',icon:'🚂',story:'A blizzard has covered the tracks. Rudolph and the Midnight Reindeer Express must carry the last Christmas parcels to North Station. The conductor has lost the route map. Can you follow the clues and get everyone moving?',ending:'The last lock clicks open. Amina takes the route map from her red suitcase, and Rudolph guides the Midnight Reindeer Express safely through the snow.',final:'NORTH',tiles:['R','H','N','T','O'],missions:[
      {name:'The Station Timetable',skill:'Reading information',kind:'choice',intro:'Read the timetable carefully.',passage:'The Snowline Express leaves Frost Station at 11:40 p.m. It stops at Pine Village at 11:55 p.m. and arrives at North Station at 12:15 a.m.',q:'Where does the train stop first after Frost Station?',options:['North Station','Pine Village','Red Hill','Winter Bridge'],correct:'Pine Village',hint:'The first stop is at 11:55 p.m.',reply:'The train reaches Pine Village at 11:55 p.m., before North Station.',letter:'R'},
      {name:'Station Word Match',skill:'Vocabulary',kind:'match',intro:'Match each English travel word with its Danish meaning.',pairs:[['ticket','billet'],['platform','perron'],['luggage','bagage']],hint:'A platform is where you wait for a train.',reply:'Ticket = billet, platform = perron, luggage = bagage.',letter:'H'},
      {name:'The Conductor’s Message',skill:'Listening',kind:'listen',intro:'Listen to the announcement and choose the correct instruction.',audio:'Bring the blue suitcase to platform three.',q:'What should the passenger do?',options:['Take a red bag to platform four','Bring a blue suitcase to platform three','Take a blue box to platform two','Leave a green suitcase in the train'],correct:'Bring a blue suitcase to platform three',hint:'Listen for the colour, the object and the number.',reply:'Blue suitcase and platform three are the three key details.',letter:'N'},
      {name:'Rudolph’s Sentence',skill:'Grammar',kind:'order',intro:'Put the words in order to describe what Rudolph is doing.',target:'Rudolph is waiting beside the green train.',tiles:['green','waiting','the','Rudolph','train.','beside','is'],hint:'Start with Rudolph, then use “is” before the -ing verb.',reply:'Present continuous: “Rudolph is waiting beside the green train.”',letter:'T'},
      {name:'The Suitcase Mystery',skill:'Logic and reading',kind:'choice',intro:'Use all three clues to find the map.',passage:'Ruby carries the purple suitcase. Leo carries the blue suitcase. Amina has neither the purple nor the blue suitcase. The map is inside the red suitcase.',q:'Who is carrying the map?',options:['Leo','Ruby','Amina','The conductor'],correct:'Amina',hint:'If Amina has neither purple nor blue, what colour is her suitcase?',reply:'Amina has the red suitcase, so she must be carrying the map.',letter:'O'},
      {name:'The North Station Lock',skill:'Word puzzle',kind:'final',intro:'Put your five letters into the correct order and open the final lock.',q:'Which direction do you travel to reach the North Pole?',hint:'It is the opposite of south.',reply:'NORTH is the direction that gives this railway its destination.'}
    ]},
    {id:'lighthouse',order:'03',theme:'Aurora by the sea',title:'The Lighthouse Christmas Star',subtitle:'An enchanted snow globe, a dark lighthouse and a coastal village.',tag:'Bring back the Christmas light!',icon:'⭐',story:'The Christmas Star has vanished from the lighthouse. Without its glow, boats cannot find the harbour in the winter darkness. An adventurous elf needs your English skills to follow the trail and bring the star home.',ending:'The star returns to the lighthouse! Golden light shines over the harbour, the fishing boats sail home safely, and the village celebrates Christmas together.',final:'LIGHT',tiles:['T','L','I','H','G'],missions:[
      {name:'The Stormy Evening',skill:'Reading comprehension',kind:'choice',intro:'Read the opening chapter of the mystery.',passage:'A storm swept over Star Bay on Christmas Eve. The wind blew open the lighthouse door. The keeper heard a loud noise, and the Christmas Star disappeared. An elf saw golden footprints leading towards the old library.',q:'Where did the golden footprints lead?',options:['To the train station','To the old library','To Santa’s workshop','To the beach café'],correct:'To the old library',hint:'Read the final sentence again.',reply:'The elf saw footprints leading towards the old library.',letter:'T'},
      {name:'Christmas Across the World',skill:'Culture and understanding',kind:'choice',intro:'Read these facts about Christmas in two countries.',passage:'In the United Kingdom, December is in winter, and the days are often cold and short. In Australia, December is in summer. Some families celebrate Christmas outdoors or at the beach.',q:'Which statement is supported by the text?',options:['Australia has summer in December','The UK has summer in December','Every Australian family goes to the beach','Christmas is in July in Australia'],correct:'Australia has summer in December',hint:'Find the sentence that says when summer happens in Australia.',reply:'Australia is in the Southern Hemisphere, where December is a summer month.',letter:'L'},
      {name:'Directions Through the Snow',skill:'Listening',kind:'listen',intro:'Listen to the elf’s directions and answer the question.',audio:'Walk past the bakery and turn left at the bridge. The library is beside the lighthouse.',q:'Where should you turn left?',options:['At the lighthouse','At the bridge','At the bakery','At the train station'],correct:'At the bridge',hint:'Listen for the words “turn left at”.',reply:'The elf says: “Turn left at the bridge.”',letter:'I'},
      {name:'Lantern Helpers',skill:'Irregular plurals',kind:'type',intro:'Two young helpers are carrying lanterns. Complete their sentence.',passage:'One child is here. Two _______ are here.',q:'Write the irregular plural of child:',answer:'children',hint:'The plural is not “childs”. It changes to a different word.',reply:'One child, two children: this is an irregular plural.',letter:'H'},
      {name:'Write to Save the Star',skill:'Writing and speaking',kind:'writing',intro:'Write two English sentences about how you will help the village. Use “will” and “because”. Then read your sentences aloud.',q:'What will you do, and why will it help?',sample:'I will look for the star because the boats need light. I will ask the keeper for help.',hint:'Try: “I will … because … .” Add a second sentence with your next action.',reply:'You have written a plan using will and because. Read it aloud and check your own spelling.',letter:'G'},
      {name:'The Lighthouse Door',skill:'Word puzzle',kind:'final',intro:'Rearrange your letters and open the lighthouse door.',q:'What shines from the lighthouse and helps boats find the coast?',hint:'It is the opposite of darkness.',reply:'LIGHT is what the lighthouse needs to guide the boats home.'}
    ]}
  ];
  const saveKey='english5d-christmas-escape-v1';
  let progress={};try{const p=JSON.parse(localStorage.getItem(saveKey)||'{}');if(p&&typeof p==='object')progress=p}catch{}
  let active=null,step=0,order=[],chosen=[],pairPick=null,paired=[],hintOpen=false,tries=0,feedback='',feedbackOk=false,transcript=false,recording=null,recordedUrl=null;
  const el=document.querySelector('#content');
  const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clean=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
  const percent=(id)=>Math.max(0,Math.min(6,Number(progress[id])||0));
  const findRoom=id=>ROOMS.find(r=>r.id===id);
  function store(){try{localStorage.setItem(saveKey,JSON.stringify(progress))}catch{}}
  function img(room){return IMG[room.id]}
  function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
  function button(label,action,klass='ghost',other=''){return `<button type="button" class="btn ${klass}" data-action="${action}" ${other}>${label}</button>`}
  function speech(str,rate=.88){if(!('speechSynthesis' in window)){message('Your browser does not support read-aloud. You can read the words on the screen.',false);return}try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(str);u.lang='en-GB';u.rate=rate;u.pitch=1;window.speechSynthesis.speak(u)}catch{message('Sound is unavailable. Please read the text on the screen.',false)}}
  function stopAudio(){try{window.speechSynthesis.cancel()}catch{}if(recording?.stream){recording.stream.getTracks().forEach(t=>t.stop());}recording=null;if(recordedUrl){URL.revokeObjectURL(recordedUrl);recordedUrl=null}}
  function home(){stopAudio();active=null;el.innerHTML=`<section class="hero"><div class="snow"></div><span class="kicker">🎄 5.D · Christmas 2026 · English</span><h1>THREE CHRISTMAS<br><span>ESCAPE ROOMS</span></h1><p>Three different Christmas adventures. Six missions in every room. Read, listen, spell, write and solve puzzles in English to unlock the final door.</p><span class="hero-note">🔊 Read-aloud help &nbsp; ✦ 18 learning missions &nbsp; ✦ No login needed</span></section><main id="main"><h2 class="section-title">Choose your Christmas adventure</h2><p class="sub">Pick a room and follow the story. Each solved mission gives you a letter for the final password.</p><div class="room-grid">${ROOMS.map(r=>`<button class="room-card" type="button" data-room="${r.id}"><div class="room-photo" style="background-image:url('${img(r)}')"><span class="photo-label">${escapeHtml(r.theme)}</span><span class="number">${percent(r.id)===6?'✓ ESCAPED':percent(r.id)+'/6 MISSIONS'}</span></div><div class="room-details"><h3>${escapeHtml(r.title)}</h3><p>${escapeHtml(r.subtitle)}</p><div class="meter"><span style="width:${100*percent(r.id)/6}%"></span></div><div class="room-foot"><span>${percent(r.id)===6?'Adventure completed':percent(r.id)?'Continue your story':'Start a new adventure'}</span><span class="arrow">→</span></div></div></button>`).join('')}</div><div class="notice"><strong>How to play:</strong> You can play on your own or with a partner. There is no timer, and you can ask for a hint. Take turns reading clues aloud. Your progress stays on this device. Some tasks use sound; headphones may help.</div></main>`;window.scrollTo(0,0)}
  function enter(id,requested){const r=findRoom(id);if(!r)return home();stopAudio();active=r;const unlocked=percent(id);const maxAllowed=unlocked>=6?5:unlocked;step=Number.isInteger(requested)?Math.max(0,Math.min(maxAllowed,requested)):maxAllowed;prepare();render();window.scrollTo(0,0)}
  function prepare(){chosen=[];pairPick=null;paired=[];tries=0;feedback='';feedbackOk=false;hintOpen=false;transcript=false;const m=active.missions[step];order=m.kind==='choice'||m.kind==='listen'?shuffle(m.options):m.kind==='order'?shuffle(m.tiles.map((t,i)=>({t,i}))):m.kind==='match'?shuffle(m.pairs.map((p,i)=>({text:p[1],idx:i}))):m.kind==='final'?active.tiles.map((t,i)=>({t,i})):[]}
  function roomPanel(){const r=active,m=r.missions[step],done=percent(r.id);return `<main id="main"><div class="crumb"><button data-action="home">All rooms</button><span>›</span><strong>${escapeHtml(r.title)}</strong></div><section class="room-hero ${r.id}"><div class="story"><span class="label">${escapeHtml(r.tag)}</span><h1>${escapeHtml(r.title)}</h1><p>${escapeHtml(r.story)}</p><div class="story-actions">${button('🔊 Listen to the story','story','gold')}${button('← All three rooms','home')}</div></div><div class="scene" role="img" aria-label="3D Christmas illustration for ${escapeHtml(r.title)}" style="background-image:url('${img(r)}')"></div></section><div class="mission-bar" role="group" aria-label="Mission progress">${r.missions.map((x,i)=>`<button type="button" class="mission-pill ${i<done?'done':i===step?'current':''}" data-jump="${i}" ${i>done?'disabled':''} aria-label="Mission ${i+1}: ${escapeHtml(x.name)}${i>done?', locked':''}"><span class="mini">${i<done?'✓':i>done?'🔒':i===5?'🔐':'✦'}</span>${i+1}. ${escapeHtml(x.name)}</button>`).join('')}</div><div class="play"><section class="panel" id="task" aria-live="polite">${done===6?completeHtml():taskHtml(m)}</section><aside class="side"><h3>🔑 Your letter clues</h3><p>Every completed mission gives you one letter. Collect five letters before the last lock.</p><div class="letters" aria-label="Letters collected">${r.missions.slice(0,5).map((x,i)=>i<done?`<span class="letter" aria-label="Letter ${escapeHtml(x.letter)}">${escapeHtml(x.letter)}</span>`:'<span class="letter empty" aria-label="Letter not earned">?</span>').join('')}</div><div class="lockwords">${done<5?`You have ${Math.min(done,5)} of 5 letters.`:done===5?'You have all five letters. Find the password!':'Christmas mission complete! 🎉'}</div><p><strong>English tip:</strong> Read each clue carefully. Talk about your answer before clicking.</p>${done===6?button('Try another room','home','dark'):button('🔊 Hear the English tip','tip','ghost')}</aside></div></main>`}
  function taskHtml(m){let k=`<div class="mission-top"><span class="tag">Mission ${step+1} / 6 · ${escapeHtml(m.skill)}</span><span class="pill">${step===5?'🔐 Final lock':'🎁 Collect a letter'}</span></div><h2>${escapeHtml(m.name)}</h2><p class="task-instruction">${escapeHtml(m.intro)}</p>`;
    if(m.passage)k+=`<div class="prompt story-prompt">${escapeHtml(m.passage)}</div>`;
    if(m.kind==='choice'){k+=`<p><strong>${escapeHtml(m.q)}</strong></p><div class="options">${order.map((opt,i)=>`<button class="option" data-choice="${i}">${escapeHtml(opt)}</button>`).join('')}</div>`}
    if(m.kind==='listen'){k+=`<div class="answer-row">${button('▶ Play the message','audio','dark')}${button('🐢 Play slowly','audio-slow','ghost')}${button('Show transcript','transcript','ghost')}</div>${transcript?`<div class="prompt"><strong>Transcript:</strong> ${escapeHtml(m.audio)}</div>`:''}<p><strong>${escapeHtml(m.q)}</strong></p><div class="options">${order.map((opt,i)=>`<button class="option" data-choice="${i}">${escapeHtml(opt)}</button>`).join('')}</div>`}
    if(m.kind==='order'){k+=`<div class="prompt">Build the sentence:</div><div class="built" aria-label="Your sentence">${chosen.length?chosen.map(({t},i)=>`<button class="word" data-remove="${i}" title="Remove this word">${escapeHtml(t)} ✕</button>`).join(''):'<span class="small">Tap the words below to build a sentence.</span>'}</div><div class="word-buttons">${order.filter(({i})=>!chosen.some(q=>q.i===i)).map(({t,i})=>`<button class="word" data-word="${i}">${escapeHtml(t)}</button>`).join('')}</div><div class="answer-row">${button('Check sentence','check','dark')}${button('Start again','clear')}</div>`}
    if(m.kind==='type'){k+=`<label for="typed"><strong>${escapeHtml(m.q)}</strong></label><div class="answer-row"><input id="typed" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word in English" maxlength="60">${button('Check answer','check','dark')}</div>`}
    if(m.kind==='match'){k+=`<div class="paircols"><div class="paircol"><strong>English</strong>${m.pairs.map(([w],i)=>`<button class="pair ${paired.includes(i)?'matched':''} ${pairPick===i?'active':''}" data-first="${i}" ${paired.includes(i)?'disabled':''}>${escapeHtml(w)}</button>`).join('')}</div><div class="paircol"><strong>Dansk</strong>${order.map(x=>`<button class="pair ${paired.includes(x.idx)?'matched':''}" data-second="${x.idx}" ${paired.includes(x.idx)?'disabled':''}>${escapeHtml(x.text)}</button>`).join('')}</div></div><p class="small">Select an English word, then choose its Danish meaning.</p>`}
    if(m.kind==='writing'){k+=`<label for="writing"><strong>${escapeHtml(m.q)}</strong></label><textarea id="writing" spellcheck="true" placeholder="I will ... because ... .&#10;Then I will ... .">${escapeHtml(window.lastWriting||'')}</textarea><div class="answer-row">${button('Check my writing','check','dark')}${button('🔊 Read the task','instruction')}</div><p class="small">This task checks for two sentences and the words “will” and “because”, not whether your English is perfect. Read your answer aloud and ask a partner or your teacher for feedback.</p><div class="answer-row">${button('🎙️ Record my voice','record-start')}${button('◼ Stop recording','record-stop','ghost',recording?.recorder?.state==='recording'?'':'disabled')}${recordedUrl?`<audio controls src="${recordedUrl}" aria-label="Play your recording"></audio>`:''}</div><p class="small">Voice recording is optional. Your audio stays on this device and is not sent to the teacher.</p>`}
    if(m.kind==='final'){k+=`<div class="prompt"><strong>Final clue:</strong> ${escapeHtml(m.q)}</div><p>Click the letter tiles to build the password.</p><div class="built" aria-label="Your password">${chosen.length?chosen.map(({t},i)=>`<button class="word" data-remove="${i}">${escapeHtml(t)} ✕</button>`).join(''):'<span class="small">Your five letters will appear here.</span>'}</div><div class="word-buttons">${order.filter(({i})=>!chosen.some(q=>q.i===i)).map(({t,i})=>`<button class="word" data-word="${i}">${escapeHtml(t)}</button>`).join('')}</div><div class="answer-row">${button('Unlock the door','check','dark')}${button('Clear password','clear')}</div>`}
    k+=`<div id="feedback" class="feedback ${feedback?feedbackOk?'yes':'no':''}" role="status">${escapeHtml(feedback)}</div><div class="answer-row" style="margin-top:22px">${button('💡 Give me a hint','hint')}${button('🔊 Hear the instructions','instruction')}</div>${hintOpen?`<div class="hint" role="note"><strong>Helpful clue:</strong> ${escapeHtml(m.hint)}</div>`:''}`;return k;
  }
  function completeHtml(){return `<div class="completed"><div class="medal">🏆🎄</div><div class="result-illustration" style="background-image:url('${img(active)}')"></div><span class="tag">You escaped!</span><h2>Christmas saved!</h2><p>${escapeHtml(active.ending)}</p><p><strong>You completed all six missions.</strong> You practised reading, listening, vocabulary and problem-solving in English.</p><div class="answer-row" style="justify-content:center">${button('🔊 Hear the ending','ending','dark')}${button('Choose another room','home','gold')}${button('Play this room again','replay')}</div><p class="small">Well done! Your progress has been saved on this device.</p></div>`}
  function render(){if(!active)return home();el.innerHTML=roomPanel()}
  function showMessage(str,ok){feedback=str;feedbackOk=ok;const node=el.querySelector('#feedback');if(node){node.textContent=str;node.className='feedback '+(ok?'yes':'no')}else render()}
  function message(str,ok=false){showMessage(str,ok)}
  function wrong(m){tries++;showMessage('Not quite. Read or listen again and try a different answer. '+(tries>=2?'The hint button can help.':''),false)}
  function win(m){showMessage(m.reply||'Excellent work!',true);const old=percent(active.id);if(step>=old){progress[active.id]=Math.max(old,step+1);store()}if(step===5){render();return}const f=el.querySelector('#feedback');if(f){const go=document.createElement('button');go.type='button';go.className='btn dark';go.dataset.action='next';go.textContent='Great! Next mission →';go.style.marginLeft='12px';f.append(go)}const bar=el.querySelector('.mission-bar');if(bar){bar.children[step].classList.add('done');bar.children[step].querySelector('.mini').textContent='✓'}const side=el.querySelector('.side');if(side){const letters=side.querySelector('.letters');if(letters)letters.innerHTML=active.missions.slice(0,5).map((x,i)=>i<percent(active.id)?`<span class="letter">${escapeHtml(x.letter)}</span>`:'<span class="letter empty">?</span>').join('')}}
  function check(){if(!active)return;const m=active.missions[step];let answer='';if(m.kind==='type')answer=el.querySelector('#typed')?.value||'';else if(m.kind==='order'||m.kind==='final')answer=chosen.map(x=>x.t).join(m.kind==='final'?'':' ');else if(m.kind==='writing'){
      const val=el.querySelector('#writing')?.value||'';window.lastWriting=val;
      const words=val.trim().match(/\b[\p{L}']+\b/gu)||[];
      const sentences=val.split(/[.!?]+/).filter(x=>x.trim().split(/\s+/).length>=4).length;
      if(words.length>=12&&sentences>=2&&/\bwill\b/i.test(val)&&/\bbecause\b/i.test(val)){win(m)}else{showMessage('Write at least two complete sentences (12 words or more). Use “will” and “because”, and finish each sentence with punctuation.',false)}return;
    }
    let good=false;
    if(m.kind==='type')good=clean(answer)===clean(m.answer);
    else if(m.kind==='order')good=clean(answer)===clean(m.target);
    else if(m.kind==='final')good=clean(answer)===clean(active.final);
    if(good)win(m);else wrong(m);
  }
  function next(){if(!active)return;enter(active.id,Math.min(5,step+1))}
  function choose(i){const m=active?.missions[step];if(!m)return;const s=order[i];if(s===undefined)return;if(clean(s)===clean(m.correct))win(m);else wrong(m)}
  function match(a,b){const m=active.missions[step];if(a===b){paired.push(a);pairPick=null;showMessage('Correct match! Find the next pair.',true);render();if(paired.length===m.pairs.length)win(m)}else{pairPick=null;wrong(m);render()}}
  async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){message('Recording is not supported in this browser. You can still complete the writing task.',false);return}if(recording?.recorder?.state==='recording')return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const recorder=new MediaRecorder(stream);const chunks=[];recording={stream,recorder};recorder.ondataavailable=ev=>{if(ev.data?.size)chunks.push(ev.data)};recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordedUrl)URL.revokeObjectURL(recordedUrl);if(chunks.length){recordedUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));}recording=null;const a=el.querySelector('audio');if(a&&recordedUrl)a.src=recordedUrl;else if(active?.missions[step]?.kind==='writing')render();};recorder.start();showMessage('Recording started. Read your two sentences aloud, then press Stop recording.',true);const stop=el.querySelector('[data-action="record-stop"]');if(stop)stop.disabled=false;}catch{message('Microphone access was not allowed. Writing is still available.',false)}}
  function stopRecording(){if(recording?.recorder?.state==='recording'){recording.recorder.stop();showMessage('Recording stopped. Listen to your own voice using the audio player.',true)}}
  function handleAction(a){const m=active?.missions[step];if(a==='home'){home();return}if(a==='story'){if(active)speech(active.story);return}if(a==='ending'){if(active)speech(active.ending);return}if(a==='tip'){speech('Read the clue carefully. Talk about the answer with your partner. Try again if you need to.');return}if(a==='replay'){if(active){progress[active.id]=0;store();enter(active.id,0)}return}if(a==='instruction'){if(m)speech(m.intro+(m.q?' '+m.q:''));return}if(a==='audio'||a==='audio-slow'){if(m?.audio)speech(m.audio,a==='audio-slow'?.70:.91);return}if(a==='transcript'){transcript=!transcript;render();return}if(a==='hint'){hintOpen=!hintOpen;render();return}if(a==='clear'){chosen=[];feedback='';render();return}if(a==='next'){next();return}if(a==='check'){check();return}if(a==='record-start'){startRecording();return}if(a==='record-stop'){stopRecording();return}}
  el.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.room){enter(b.dataset.room);return}if(b.dataset.action){handleAction(b.dataset.action);return}if(b.dataset.jump!==undefined){const i=Number(b.dataset.jump);if(active&&i<=percent(active.id))enter(active.id,i);return}if(b.dataset.choice!==undefined){choose(Number(b.dataset.choice));return}if(b.dataset.word!==undefined){const i=Number(b.dataset.word),tile=order.find(x=>x.i===i);if(tile&&!chosen.some(x=>x.i===i)){chosen.push(tile);render()}return}if(b.dataset.remove!==undefined){chosen.splice(Number(b.dataset.remove),1);render();return}if(b.dataset.first!==undefined){pairPick=Number(b.dataset.first);render();return}if(b.dataset.second!==undefined){if(pairPick===null){showMessage('Select an English word first.',false);return}match(pairPick,Number(b.dataset.second));return}});
  document.querySelector('.bar').addEventListener('click',ev=>{const b=ev.target.closest('button[data-action]');if(b)handleAction(b.dataset.action)});
  el.addEventListener('input',ev=>{if(ev.target.id==='writing')window.lastWriting=ev.target.value});
  el.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('#typed')){ev.preventDefault();check()}});
  window.addEventListener('pagehide',stopAudio);
  home();
})();
</script>
